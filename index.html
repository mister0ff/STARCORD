<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Starcord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0b0e;
      --bg-panel: #13131a;
      --bg-card: #181824;
      --bg-hover: #222230;
      --bg-input: #1c1c28;
      
      --accent-red: #e50914;
      --accent-red-hover: #ff1e27;
      --accent-red-glow: rgba(229, 9, 20, 0.25);
      
      --text-main: #f3f3f7;
      --text-muted: #8b8ba7;
      --border-color: rgba(255, 255, 255, 0.07);
      --border-focus: rgba(229, 9, 20, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    /* Tela Splash Inicial */
    .splash-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-icon {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    /* Tela de Autenticação */
    .auth-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top center, rgba(229, 9, 20, 0.15), transparent 60%), var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .auth-card {
      background: var(--bg-panel);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-color);
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .brand-logo img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px var(--accent-red-glow));
    }

    .auth-card h2 {
      color: var(--text-main);
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      margin-top: -8px;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .username-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .username-prefix {
      position: absolute;
      left: 12px;
      color: var(--accent-red);
      font-weight: 700;
      font-size: 14px;
      pointer-events: none;
    }

    .username-input-wrapper input {
      padding-left: 28px !important;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    input:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-red-glow);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-red), #b80710);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--accent-red-glow);
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--accent-red-hover), var(--accent-red));
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #2c2c3e;
    }

    .btn-icon {
      padding: 8px;
      border-radius: 8px;
      aspect-ratio: 1;
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 12px;
      text-align: center;
      min-height: 14px;
    }

    .toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
      width: 100%;
      padding: 0 16px;
    }

    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-red);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 380px;
      width: 100%;
      animation: toastIn 0.2s ease;
    }

    .toast.success { border-left-color: #23c268; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Layout Principal */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .sidebar {
      width: 100%;
      height: 100%;
      background-color: var(--bg-panel);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      overflow: hidden;
    }

    .user-profile {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }

    .user-profile:hover { background-color: var(--bg-hover); }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .user-avatar-main {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-red), #500);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .user-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-display-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-handle {
      font-size: 11px;
      color: var(--accent-red);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .add-friend-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .section-header {
      padding: 12px 16px 6px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .friends-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 0 8px;
    }

    .friend-item {
      padding: 10px 12px;
      margin-bottom: 2px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .friend-item:hover { background-color: var(--bg-hover); }

    .friend-avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .friend-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-red), #800000);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #ffffff;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
    }

    .friend-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .friend-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend-last-msg {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Área do Chat */
    .chat-area {
      display: none;
      width: 100%;
      height: 100%;
      height: 100dvh;
      flex-direction: column;
      background-color: var(--bg-dark);
      overflow: hidden;
    }

    .app-container.chat-open .sidebar { display: none; }
    .app-container.chat-open .chat-area { display: flex; }

    .chat-header {
      padding: 0 16px;
      background-color: rgba(19, 19, 26, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      flex-shrink: 0;
    }

    .chat-user-target {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .chat-user-target:hover { background-color: var(--bg-hover); }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      word-wrap: break-word;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .message.received {
      align-self: flex-start;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    .message.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent-red), #b80710);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      margin-top: 6px;
      display: block;
    }

    .time {
      font-size: 10px;
      margin-top: 4px;
      display: block;
      opacity: 0.65;
      text-align: right;
    }

    .chat-footer {
      padding: 12px 16px;
      background-color: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .file-btn {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    #fileInput, #avatarFileInput { display: none; }

    /* Modais */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 300;
      padding: 16px;
    }

    .profile-modal {
      background: var(--bg-panel);
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--border-color);
    }

    .profile-banner {
      height: 100px;
      background: linear-gradient(135deg, var(--accent-red), #400000);
      position: relative;
    }

    .profile-avatar-wrapper {
      position: relative;
      margin-top: -40px;
      margin-left: 20px;
      width: 80px;
      height: 80px;
    }

    .profile-avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 4px solid var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--accent-red);
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .avatar-edit-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .profile-avatar-wrapper:hover .avatar-edit-overlay { opacity: 1; }

    .profile-body {
      padding: 16px 20px 20px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .profile-card-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .field-value {
      font-size: 13px;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* Modal de Ajuste/Corte do Avatar */
    .crop-modal-content {
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .crop-viewport-container {
      position: relative;
      width: 260px;
      height: 260px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      touch-action: none;
      cursor: move;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .crop-grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .crop-grid-overlay div {
      border: 1px dashed rgba(255, 255, 255, 0.25);
    }

    .crop-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .crop-slider-label {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent-red);
    }

    .crop-actions {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Tela Splash -->
  <div id="splashScreen" class="splash-screen">
    <img id="splashIcon" class="splash-icon" src="icon.png" alt="Carregando..." />
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Autenticação -->
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="brand-logo">
        <img src="icon.png" alt="Starcord" />
      </div>
      <h2 id="authTitle">Criar Conta</h2>
      <p id="authSub">Preencha os dados abaixo</p>
      
      <!-- Nome de Usuário -->
      <div class="input-group" id="groupUsername">
        <div class="username-input-wrapper">
          <span class="username-prefix">@</span>
          <input type="text" id="authUsername" placeholder="Nome de Usuário" autocomplete="off" />
        </div>
      </div>

      <!-- Seu E-mail -->
      <div class="input-group" id="groupEmail">
        <input type="email" id="authEmail" placeholder="Seu E-mail" autocomplete="off" />
      </div>

      <!-- Crie uma Senha -->
      <div class="input-group">
        <input type="password" id="authPassword" placeholder="Crie uma senha" />
      </div>

      <!-- Confirme sua Senha -->
      <div class="input-group" id="groupConfirmPassword">
        <input type="password" id="authConfirmPassword" placeholder="Confirme sua senha" />
      </div>
      
      <button class="btn" id="btnAuthSubmit">Cadastrar</button>
      <button class="btn btn-secondary" id="btnToggleAuthMode">Já tenho conta!</button>
      
      <div id="authError" class="error-msg"></div>
    </div>
  </div>

  <!-- Interface Principal -->
  <div id="appScreen" class="app-container hidden">
    <div class="sidebar">
      <div class="user-profile" id="btnOpenSelfProfile" title="Clique para editar seu perfil">
        <div class="user-info">
          <div class="user-avatar-main" id="userAvatarMain">U</div>
          <div class="user-details">
            <span class="user-display-name" id="userDisplayName">...</span>
            <span class="user-handle" id="userHandle">@user</span>
          </div>
        </div>
        <button class="btn btn-secondary btn-icon" id="btnLogout" title="Sair">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>

      <!-- Adicionar Amigo via @ -->
      <div class="add-friend-box">
        <div class="username-input-wrapper" style="flex: 1;">
          <span class="username-prefix">@</span>
          <input type="text" id="friendUsernameInput" placeholder="amigo" autocomplete="off" />
        </div>
        <button class="btn btn-icon" id="btnAddFriend" title="Enviar Pedido">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
        </button>
      </div>

      <div class="section-header">
        <span>Mensagens</span>
      </div>
      <div class="friends-list" id="friendsList"></div>
    </div>

    <!-- Área do Chat -->
    <div class="chat-area" id="chatArea">
      <div class="chat-header">
        <button id="btnBack" class="btn btn-secondary btn-icon" title="Voltar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="chat-user-target" id="btnOpenFriendProfile" title="Ver perfil do amigo">
          <div class="friend-avatar" id="chatAvatar">A</div>
          <div class="user-details">
            <h3 id="chatTargetTitle">@amigo</h3>
            <span class="user-handle" id="chatTargetHandle">Clique para ver o perfil</span>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages"></div>

      <form class="chat-footer" id="chatForm">
        <label for="fileInput" class="file-btn" title="Anexar arquivo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57a4 4 0 1 1 5.66 5.66l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </label>
        <input type="file" id="fileInput" />
        <input type="text" id="messageInput" placeholder="Digite sua mensagem..." autocomplete="off" />
        <button type="submit" class="btn btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Modal de Perfil -->
  <div id="profileModal" class="modal-overlay hidden">
    <div class="profile-modal">
      <div class="modal-top-bar">
        <button class="btn btn-secondary btn-icon" id="btnCloseProfileModal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <h3 id="profileModalTitle">Perfil</h3>
        <button class="btn" id="btnSaveProfile">Salvar</button>
      </div>

      <div class="profile-banner"></div>

      <div class="profile-avatar-wrapper">
        <div class="profile-avatar-preview" id="modalAvatarPreview">U</div>
        <label for="avatarFileInput" class="avatar-edit-overlay" id="modalAvatarEditOverlay" title="Alterar Avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </label>
        <input type="file" id="avatarFileInput" accept="image/*" />
      </div>

      <div class="profile-body">
        <div class="profile-card-section">
          <div class="field-label">Nome de Exibição</div>
          <input type="text" id="editDisplayName" placeholder="Ex: Lucas" />
          <div class="field-value hidden" id="viewDisplayName"></div>

          <div class="field-label">Pronomes</div>
          <input type="text" id="editPronouns" placeholder="ex: ele/dele" />
          <div class="field-value hidden" id="viewPronouns"></div>
        </div>

        <div class="profile-card-section">
          <div class="field-label">Sobre mim (Bio)</div>
          <textarea id="editBio" placeholder="Escreva algo sobre você..."></textarea>
          <div class="field-value hidden" id="viewBio"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Ajuste/Corte de Avatar -->
  <div id="cropModal" class="modal-overlay hidden">
    <div class="crop-modal-content">
      <div style="font-size: 14px; font-weight: 700; width: 100%; text-align: center;">Editar imagem</div>
      
      <div class="crop-viewport-container" id="cropContainer">
        <canvas id="cropCanvas" width="260" height="260"></canvas>
        <div class="crop-grid-overlay">
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
        </div>
      </div>

      <div class="crop-controls">
        <div class="crop-slider-label">
          <span>Tamanho / Zoom</span>
          <span id="zoomVal">100%</span>
        </div>
        <input type="range" id="cropZoom" min="100" max="500" value="100" />
      </div>

      <div class="crop-actions">
        <button class="btn btn-secondary" id="btnCancelCrop" style="flex:1;">Cancelar</button>
        <button class="btn" id="btnApplyCrop" style="flex:1;">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Firebase Web SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      getDoc,
      addDoc, 
      query, 
      orderBy, 
      onSnapshot, 
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAoqc8NcgLAQqclCFY-q_PcxATIE0FqU_E",
      authDomain: "starcord-ee336.firebaseapp.com",
      projectId: "starcord-ee336",
      storageBucket: "starcord-ee336.firebasestorage.app",
      messagingSenderId: "166227286926",
      appId: "1:166227286926:web:8cafd28b2eda5fbaf0e2df",
      measurementId: "G-E06X0P832W"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUsername = null;
    let targetUsername = null;
    let unsubscribeMessages = null;
    let tempAvatarBase64 = null;
    let isLoginMode = false; // Inicia em modo de cadastro

    // Sanitização de username
    function cleanUsername(input) {
      if (!input) return "";
      let str = input.trim().toLowerCase();
      if (str.startsWith('@')) str = str.substring(1);
      return str.replace(/[^a-z0-9_]/g, '');
    }

    // Splash Screen
    let splashFinished = false;
    let authChecked = false;
    const splashScreen = document.getElementById('splashScreen');
    const splashIcon = document.getElementById('splashIcon');
    const SECOND_ICON_URL = "white_icon.png";

    setTimeout(() => {
      splashIcon.src = SECOND_ICON_URL;
      setTimeout(() => {
        splashFinished = true;
        revelarTelaCorreta();
      }, 600);
    }, 1000);

    function revelarTelaCorreta() {
      if (!splashFinished || !authChecked) return;
      splashScreen.classList.add('hidden');
      if (currentUsername) {
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
      } else {
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
      }
    }

    // Elementos DOM Autenticação
    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const authTitle = document.getElementById('authTitle');
    const authSub = document.getElementById('authSub');
    const authUsername = document.getElementById('authUsername');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authConfirmPassword = document.getElementById('authConfirmPassword');
    const btnAuthSubmit = document.getElementById('btnAuthSubmit');
    const btnToggleAuthMode = document.getElementById('btnToggleAuthMode');
    const authError = document.getElementById('authError');
    const groupUsername = document.getElementById('groupUsername');
    const groupConfirmPassword = document.getElementById('groupConfirmPassword');

    const userDisplayName = document.getElementById('userDisplayName');
    const userHandle = document.getElementById('userHandle');
    const userAvatarMain = document.getElementById('userAvatarMain');
    const btnLogout = document.getElementById('btnLogout');

    const friendUsernameInput = document.getElementById('friendUsernameInput');
    const btnAddFriend = document.getElementById('btnAddFriend');
    const friendsList = document.getElementById('friendsList');

    const btnBack = document.getElementById('btnBack');
    const chatTargetTitle = document.getElementById('chatTargetTitle');
    const chatTargetHandle = document.getElementById('chatTargetHandle');
    const chatAvatar = document.getElementById('chatAvatar');
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const fileInput = document.getElementById('fileInput');

    const toastContainer = document.getElementById('toastContainer');

    // Modal DOM
    const profileModal = document.getElementById('profileModal');
    const btnOpenSelfProfile = document.getElementById('btnOpenSelfProfile');
    const btnOpenFriendProfile = document.getElementById('btnOpenFriendProfile');
    const btnCloseProfileModal = document.getElementById('btnCloseProfileModal');
    const btnSaveProfile = document.getElementById('btnSaveProfile');
    const profileModalTitle = document.getElementById('profileModalTitle');

    const modalAvatarPreview = document.getElementById('modalAvatarPreview');
    const modalAvatarEditOverlay = document.getElementById('modalAvatarEditOverlay');
    const avatarFileInput = document.getElementById('avatarFileInput');

    const editDisplayName = document.getElementById('editDisplayName');
    const viewDisplayName = document.getElementById('viewDisplayName');
    const editPronouns = document.getElementById('editPronouns');
    const viewPronouns = document.getElementById('viewPronouns');
    const editBio = document.getElementById('editBio');
    const viewBio = document.getElementById('viewBio');

    // Modal Crop DOM
    const cropModal = document.getElementById('cropModal');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropContainer = document.getElementById('cropContainer');
    const cropZoom = document.getElementById('cropZoom');
    const zoomVal = document.getElementById('zoomVal');
    const btnCancelCrop = document.getElementById('btnCancelCrop');
    const btnApplyCrop = document.getElementById('btnApplyCrop');
    const ctx = cropCanvas.getContext('2d');

    let loadedImg = null;
    let imgPos = { x: 0, y: 0 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    function showToast(message, type = 'info') {
      const el = document.createElement('div');
      el.className = 'toast' + (type === 'success' ? ' success' : '');
      el.textContent = message;
      toastContainer.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    [authUsername, friendUsernameInput].forEach(input => {
      input.addEventListener('input', (e) => {
        e.target.value = cleanUsername(e.target.value);
      });
    });

    // Alternar entre Login e Cadastro
    btnToggleAuthMode.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      authError.textContent = '';

      if (isLoginMode) {
        authTitle.textContent = "Entrar no Starcord";
        authSub.textContent = "Digite seus dados para acessar";
        groupUsername.classList.add('hidden');
        groupConfirmPassword.classList.add('hidden');
        authPassword.placeholder = "Sua senha";
        btnAuthSubmit.textContent = "Entrar";
        btnToggleAuthMode.textContent = "Criar uma conta";
      } else {
        authTitle.textContent = "Criar Conta";
        authSub.textContent = "Preencha os dados abaixo";
        groupUsername.classList.remove('hidden');
        groupConfirmPassword.classList.remove('hidden');
        authPassword.placeholder = "Crie uma senha";
        btnAuthSubmit.textContent = "Cadastrar";
        btnToggleAuthMode.textContent = "Já tenho conta!";
      }
    });

    onAuthStateChanged(auth, async (user) => {
      authChecked = true;
      if (user) {
        const userMapSnap = await getDoc(doc(db, "users_map", user.uid));
        if (userMapSnap.exists()) {
          currentUsername = userMapSnap.data().username;
        } else {
          currentUsername = user.email.split('@')[0];
        }
        await carregarMeuPerfil();
        carregarAmigos();
      } else {
        currentUsername = null;
      }
      revelarTelaCorreta();
    });

    // Submeter Formulário de Autenticação
    btnAuthSubmit.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      const uName = cleanUsername(authUsername.value);
      const confirmPassword = authConfirmPassword.value;
      authError.textContent = '';

      if (!email) {
        authError.textContent = 'Digite o seu e-mail.';
        return;
      }
      if (!password) {
        authError.textContent = 'Digite a sua senha.';
        return;
      }

      if (!isLoginMode) {
        if (!uName) {
          authError.textContent = 'Digite um nome de usuário.';
          return;
        }
        if (password !== confirmPassword) {
          authError.textContent = 'As senhas não coincidem!';
          return;
        }
      }

      btnAuthSubmit.disabled = true;

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          // 1. Cria a conta no Firebase Auth PRIMEIRO para autenticar o usuário
          const userCred = await createUserWithEmailAndPassword(auth, email, password);

          // 2. Agora autenticado (request.auth != null), verifica e grava os documentos
          const profileSnap = await getDoc(doc(db, "profiles", uName));
          if (profileSnap.exists()) {
            authError.textContent = 'Este @username já está em uso.';
            btnAuthSubmit.disabled = false;
            return;
          }

          await setDoc(doc(db, "profiles", uName), {
            username: uName,
            displayName: uName,
            email: email,
            uid: userCred.user.uid,
            pronouns: '',
            bio: '',
            avatarUrl: ''
          });

          await setDoc(doc(db, "users_map", userCred.user.uid), {
            username: uName,
            email: email
          });
        }
      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          authError.textContent = 'Este e-mail já está cadastrado.';
        } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          authError.textContent = 'E-mail ou senha incorretos.';
        } else if (error.code === 'auth/weak-password') {
          authError.textContent = 'A senha precisa ter no mínimo 6 caracteres.';
        } else {
          authError.textContent = 'Erro: ' + error.message;
        }
      } finally {
        btnAuthSubmit.disabled = false;
      }
    });

    btnLogout.addEventListener('click', (e) => {
      e.stopPropagation();
      signOut(auth);
    });

    btnBack.addEventListener('click', () => {
      appScreen.classList.remove('chat-open');
      targetUsername = null;
    });

    async function carregarMeuPerfil() {
      const profileRef = doc(db, "profiles", currentUsername);
      onSnapshot(profileRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          userDisplayName.textContent = data.displayName || currentUsername;
          userHandle.textContent = `@${currentUsername}`;
          
          if (data.avatarUrl) {
            userAvatarMain.style.backgroundImage = `url(${data.avatarUrl})`;
            userAvatarMain.textContent = '';
          } else {
            userAvatarMain.style.backgroundImage = 'none';
            userAvatarMain.textContent = currentUsername[0].toUpperCase();
          }
        }
      });
    }

    /* Sistema de Ajuste/Corte de Imagem do Avatar */
    avatarFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImg = new Image();
        loadedImg.onload = () => {
          cropZoom.value = 100;
          zoomVal.textContent = '100%';
          imgPos = { x: 0, y: 0 };
          drawCropCanvas();
          cropModal.classList.remove('hidden');
        };
        loadedImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    function drawCropCanvas() {
      if (!loadedImg) return;
      ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
      
      const scale = cropZoom.value / 100;
      const w = cropCanvas.width * scale;
      const h = (loadedImg.height / loadedImg.width) * w;

      const x = (cropCanvas.width - w) / 2 + imgPos.x;
      const y = (cropCanvas.height - h) / 2 + imgPos.y;

      ctx.drawImage(loadedImg, x, y, w, h);
    }

    cropZoom.addEventListener('input', () => {
      zoomVal.textContent = `${cropZoom.value}%`;
      drawCropCanvas();
    });

    cropContainer.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragStart = { x: e.clientX - imgPos.x, y: e.clientY - imgPos.y };
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      imgPos = { x: e.clientX - dragStart.x, y: e.clientY - dragStart.y };
      drawCropCanvas();
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    btnCancelCrop.addEventListener('click', () => {
      cropModal.classList.add('hidden');
      loadedImg = null;
    });

    btnApplyCrop.addEventListener('click', () => {
      tempAvatarBase64 = cropCanvas.toDataURL('image/jpeg', 0.85);
      modalAvatarPreview.style.backgroundImage = `url(${tempAvatarBase64})`;
      modalAvatarPreview.textContent = '';
      cropModal.classList.add('hidden');
    });

    /* Perfil */
    btnOpenSelfProfile.addEventListener('click', async () => {
      const profileSnap = await getDoc(doc(db, "profiles", currentUsername));
      const data = profileSnap.data() || {};

      profileModalTitle.textContent = "Editar Perfil";
      btnSaveProfile.classList.remove('hidden');
      modalAvatarEditOverlay.classList.remove('hidden');

      editDisplayName.classList.remove('hidden');
      editPronouns.classList.remove('hidden');
      editBio.classList.remove('hidden');

      viewDisplayName.classList.add('hidden');
      viewPronouns.classList.add('hidden');
      viewBio.classList.add('hidden');

      editDisplayName.value = data.displayName || '';
      editPronouns.value = data.pronouns || '';
      editBio.value = data.bio || '';

      if (data.avatarUrl) {
        modalAvatarPreview.style.backgroundImage = `url(${data.avatarUrl})`;
        modalAvatarPreview.textContent = '';
      } else {
        modalAvatarPreview.style.backgroundImage = 'none';
        modalAvatarPreview.textContent = currentUsername[0].toUpperCase();
      }

      profileModal.classList.remove('hidden');
    });

    btnOpenFriendProfile.addEventListener('click', async () => {
      if (!targetUsername) return;

      const profileSnap = await getDoc(doc(db, "profiles", targetUsername));
      const data = profileSnap.data() || {};

      profileModalTitle.textContent = `@${targetUsername}`;
      btnSaveProfile.classList.add('hidden');
      modalAvatarEditOverlay.classList.add('hidden');

      editDisplayName.classList.add('hidden');
      editPronouns.classList.add('hidden');
      editBio.classList.add('hidden');

      viewDisplayName.classList.remove('hidden');
      viewPronouns.classList.remove('hidden');
      viewBio.classList.remove('hidden');

      viewDisplayName.textContent = data.displayName || targetUsername;
      viewPronouns.textContent = data.pronouns || 'Não informado';
      viewBio.textContent = data.bio || 'Sem biografia.';

      if (data.avatarUrl) {
        modalAvatarPreview.style.backgroundImage = `url(${data.avatarUrl})`;
        modalAvatarPreview.textContent = '';
      } else {
        modalAvatarPreview.style.backgroundImage = 'none';
        modalAvatarPreview.textContent = targetUsername[0].toUpperCase();
      }

      profileModal.classList.remove('hidden');
    });

    btnCloseProfileModal.addEventListener('click', () => {
      profileModal.classList.add('hidden');
      tempAvatarBase64 = null;
    });

    btnSaveProfile.addEventListener('click', async () => {
      btnSaveProfile.disabled = true;
      try {
        const updateData = {
          displayName: editDisplayName.value.trim() || currentUsername,
          pronouns: editPronouns.value.trim(),
          bio: editBio.value.trim()
        };

        if (tempAvatarBase64) {
          updateData.avatarUrl = tempAvatarBase64;
        }

        await setDoc(doc(db, "profiles", currentUsername), updateData, { merge: true });
        showToast('Perfil salvo!', 'success');
        profileModal.classList.add('hidden');
        tempAvatarBase64 = null;
      } catch (err) {
        showToast('Erro ao salvar: ' + err.message);
      } finally {
        btnSaveProfile.disabled = false;
      }
    });

    /* Adicionar Amigos via @ */
    btnAddFriend.addEventListener('click', async () => {
      const friendUser = cleanUsername(friendUsernameInput.value);
      if (!friendUser) return;

      if (friendUser === currentUsername) {
        showToast('Você não pode adicionar a si mesmo.');
        return;
      }

      btnAddFriend.disabled = true;
      try {
        const friendProfileSnap = await getDoc(doc(db, "profiles", friendUser));
        if (!friendProfileSnap.exists()) {
          showToast('Usuário não encontrado.');
          return;
        }

        await setDoc(doc(db, "users", currentUsername, "friends", friendUser), {
          username: friendUser,
          addedAt: serverTimestamp()
        });

        await setDoc(doc(db, "users", friendUser, "friends", currentUsername), {
          username: currentUsername,
          addedAt: serverTimestamp()
        });

        friendUsernameInput.value = '';
        showToast(`@${friendUser} adicionado!`, 'success');
      } catch (err) {
        showToast('Erro ao adicionar amigo: ' + err.message);
      } finally {
        btnAddFriend.disabled = false;
      }
    });

    function carregarAmigos() {
      const friendsRef = collection(db, "users", currentUsername, "friends");
      onSnapshot(friendsRef, (snapshot) => {
        friendsList.innerHTML = '';
        snapshot.forEach(async (docSnap) => {
          const friendUser = docSnap.id;
          const profileSnap = await getDoc(doc(db, "profiles", friendUser));
          const pData = profileSnap.data() || {};

          const displayName = pData.displayName || friendUser;
          const item = document.createElement('div');
          item.classList.add('friend-item');

          let avatarStyle = pData.avatarUrl ? `style="background-image: url('${pData.avatarUrl}')"` : '';
          let avatarContent = pData.avatarUrl ? '' : displayName[0].toUpperCase();

          item.innerHTML = `
            <div class="friend-avatar-wrapper">
              <div class="friend-avatar" ${avatarStyle}>${avatarContent}</div>
            </div>
            <div class="friend-details">
              <div class="friend-name">${displayName}</div>
              <div class="friend-last-msg">@${friendUser}</div>
            </div>
          `;

          item.addEventListener('click', () => abrirChat(friendUser, displayName, pData.avatarUrl));
          friendsList.appendChild(item);
        });
      });
    }

    function abrirChat(username, displayName, avatarUrl) {
      targetUsername = username;
      chatTargetTitle.textContent = displayName;
      chatTargetHandle.textContent = `@${username}`;

      if (avatarUrl) {
        chatAvatar.style.backgroundImage = `url(${avatarUrl})`;
        chatAvatar.textContent = '';
      } else {
        chatAvatar.style.backgroundImage = 'none';
        chatAvatar.textContent = displayName[0].toUpperCase();
      }

      appScreen.classList.add('chat-open');
      carregarMensagens();
    }

    function carregarMensagens() {
      chatMessages.innerHTML = '';
      const roomId = [currentUsername, targetUsername].sort().join('_');

      const q = query(
        collection(db, "chats", roomId, "messages"),
        orderBy("timestamp", "asc")
      );

      if (unsubscribeMessages) unsubscribeMessages();

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        chatMessages.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const tipo = data.sender === currentUsername ? 'sent' : 'received';

          let hora = '';
          if (data.timestamp) {
            const date = data.timestamp.toDate();
            hora = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }

          const msgDiv = document.createElement('div');
          msgDiv.classList.add('message', tipo);

          let conteudo = '';
          if (data.text) conteudo += `<div>${data.text}</div>`;
          if (data.fileUrl) conteudo += `<img src="${data.fileUrl}" alt="Imagem" />`;

          msgDiv.innerHTML = `${conteudo}<span class="time">${hora}</span>`;
          chatMessages.appendChild(msgDiv);
        });

        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const text = messageInput.value.trim();
      const file = fileInput.files[0];

      if ((!text && !file) || !targetUsername) return;

      const roomId = [currentUsername, targetUsername].sort().join('_');
      messageInput.value = '';
      let fileUrl = null;

      if (file) {
        fileUrl = await new Promise((res) => {
          const r = new FileReader();
          r.onload = (ev) => res(ev.target.result);
          r.readAsDataURL(file);
        });
        fileInput.value = '';
      }

      try {
        await addDoc(collection(db, "chats", roomId, "messages"), {
          text: text,
          fileUrl: fileUrl,
          sender: currentUsername,
          recipient: targetUsername,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        showToast('Erro ao enviar mensagem.');
      }
    });
  </script>
</body>
</html>
