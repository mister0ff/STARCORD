<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Discord 2 - Avatar Firebase</title>
  <style>
    :root {
      --bg-darker: #1e1f22;
      --bg-sidebar: #2b2d31;
      --bg-chat: #313338;
      --input-bg: #383a40;
      --accent-red: #f23f43;
      --accent-red-hover: #d83a3e;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
      --font-stack: 'gg sans', 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-darker);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 1. Barra de Servidores */
    .server-list {
      width: 72px;
      background-color: var(--bg-darker);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 8px;
      border-right: 1px solid rgba(0,0,0,0.2);
    }

    .server-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--bg-sidebar);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .server-icon:hover, .server-icon.active {
      border-radius: 16px;
      background-color: var(--accent-red);
    }

    .server-divider {
      width: 32px;
      height: 2px;
      background-color: var(--bg-sidebar);
      margin: 4px 0;
    }

    /* 2. Barra Lateral */
    .channels-sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
    }

    .server-header {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      font-weight: bold;
      border-bottom: 1px solid rgba(0,0,0,0.2);
    }

    .channel-list {
      flex: 1;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .channel-item.active {
      background-color: rgba(255,255,255,0.07);
      color: var(--text-main);
      font-weight: 600;
    }

    /* Avatar e Perfil */
    .user-profile-bar {
      height: 56px;
      background-color: #232428;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 8px;
    }

    .avatar-wrapper {
      position: relative;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }

    .avatar-img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #000;
      display: block;
    }

    .avatar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 10px;
      color: #fff;
    }

    .avatar-wrapper:hover .avatar-overlay {
      opacity: 1;
    }

    .status-online {
      width: 10px;
      height: 10px;
      background-color: #23a55a;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
      border: 2px solid #232428;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
    }

    .user-tag {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 3. Área de Chat */
    .chat-area {
      flex: 1;
      background-color: var(--bg-chat);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(0,0,0,0.2);
      font-weight: bold;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-group {
      display: flex;
      gap: 16px;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .author-name {
      font-weight: 600;
      font-size: 15px;
    }

    .author-badge {
      background-color: var(--accent-red);
      color: #fff;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: bold;
    }

    .timestamp {
      font-size: 12px;
      color: var(--text-muted);
    }

    .message-text {
      color: #dbdee1;
      font-size: 15px;
      line-height: 1.375;
      word-break: break-word;
    }

    .chat-input-area {
      padding: 0 16px 24px 16px;
    }

    .chat-input-form {
      background-color: var(--input-bg);
      border-radius: 8px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      padding: 12px 0;
      font-size: 15px;
    }

    .send-btn {
      background-color: var(--accent-red);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    #fileInput {
      display: none;
    }
  </style>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="app-container">
    <nav class="server-list">
      <div class="server-icon active">R2</div>
      <div class="server-divider"></div>
      <div class="server-icon">★</div>
    </nav>

    <aside class="channels-sidebar">
      <div class="server-header">
        <span>RED DISCORD 2</span>
      </div>
      
      <div class="channel-list">
        <div class="channel-item active">
          <span>#</span>
          <span>chat-geral</span>
        </div>
      </div>

      <!-- Barra do Usuário com Clique para Trocar Imagem -->
      <div class="user-profile-bar">
        <div class="avatar-wrapper" onclick="document.getElementById('fileInput').click()" title="Clique para alterar avatar">
          <img id="myAvatarImg" class="avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><rect width='36' height='36' fill='%23f23f43'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='white' font-weight='bold' font-size='16'>E</text></svg>" alt="Avatar">
          <div class="avatar-overlay">EDITAR</div>
          <div class="status-online"></div>
        </div>
        <input type="file" id="fileInput" accept="image/*">
        
        <div class="user-info">
          <span class="user-name">./Eduh®💢z</span>
          <span class="user-tag">#STAR</span>
        </div>
      </div>
    </aside>

    <main class="chat-area">
      <div class="chat-header">
        <span style="color: var(--text-muted); font-size: 20px;">#</span>
        <span>chat-geral</span>
      </div>

      <div class="chat-messages" id="chatFeed"></div>

      <div class="chat-input-area">
        <form class="chat-input-form" id="messageForm">
          <input type="text" class="chat-input" id="messageInput" placeholder="Conversar em #chat-geral" autocomplete="off" required>
          <button type="submit" class="send-btn">Enviar</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Configuração do Firebase (Substitua pelos seus dados do console)
    const firebaseConfig = {
      apiKey: "AIzaSyYOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userId = "eduh_user_01";
    const username = "./Eduh®💢z";
    const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><rect width='36' height='36' fill='%23f23f43'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='white' font-weight='bold' font-size='16'>E</text></svg>";
    let currentUserAvatar = localStorage.getItem('user_avatar') || defaultAvatar;

    const myAvatarImg = document.getElementById('myAvatarImg');
    const fileInput = document.getElementById('fileInput');
    const chatFeed = document.getElementById('chatFeed');
    const form = document.getElementById('messageForm');
    const input = document.getElementById('messageInput');

    myAvatarImg.src = currentUserAvatar;

    // Converte a Imagem para URL Data-Base64 e Comprime via Canvas
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const compressedBase64Url = await processAndResizeImage(file, 128, 128);
        currentUserAvatar = compressedBase64Url;
        myAvatarImg.src = currentUserAvatar;
        localStorage.setItem('user_avatar', currentUserAvatar);

        // Atualiza perfil no Firebase Firestore
        await db.collection("users").doc(userId).set({
          username: username,
          avatarUrl: currentUserAvatar,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

      } catch (err) {
        console.error("Erro ao converter imagem:", err);
      }
    });

    // Função de Redimensionamento e Conversão para URL
    function processAndResizeImage(file, maxWidth, maxHeight) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = maxWidth;
            canvas.height = maxHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, maxWidth, maxHeight);
            resolve(canvas.toDataURL('image/jpeg', 0.8)); // Gera Data URL em formato compacto
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Enviar mensagem para o Firebase Firestore
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      try {
        await db.collection("messages").add({
          text: text,
          userId: userId,
          author: username,
          avatarUrl: currentUserAvatar,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        // Fallback local caso o Firebase não esteja configurado com chaves válidas
        renderLocalMessage({
          text: text,
          author: username,
          avatarUrl: currentUserAvatar,
          timestamp: new Date()
        });
      }
    });

    // Escuta mensagens do Firebase em Tempo Real
    try {
      db.collection("messages")
        .orderBy("timestamp", "asc")
        .onSnapshot((snapshot) => {
          chatFeed.innerHTML = '';
          snapshot.forEach((doc) => {
            const data = doc.data();
            renderLocalMessage(data);
          });
          chatFeed.scrollTop = chatFeed.scrollHeight;
        }, () => {
          console.warn("Rodando em modo local sem chaves ativas do Firebase Firestore.");
        });
    } catch(e){}

    function renderLocalMessage(data) {
      const timeStr = data.timestamp && data.timestamp.toDate 
        ? data.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message-group';
      msgDiv.innerHTML = `
        <img class="avatar-img" src="${data.avatarUrl || defaultAvatar}" alt="Avatar">
        <div class="message-content">
          <div class="message-meta">
            <span class="author-name">${escapeHtml(data.author)}</span>
            <span class="author-badge">STAR</span>
            <span class="timestamp">Hoje às ${timeStr}</span>
          </div>
          <div class="message-text">${escapeHtml(data.text)}</div>
        </div>
      `;
      chatFeed.appendChild(msgDiv);
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
  </script>
</body>
</html>
