<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starcord - Dark Red</title>
  <style>
    :root {
      --bg-dark: #121212;
      --bg-panel: #1e1e1e;
      --bg-hover: #2a2a2a;
      --bg-input: #292929;
      --accent-red: #e50914;
      --accent-red-hover: #b80710;
      --text-main: #f5f5f5;
      --text-muted: #aaaaaa;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    /* Tela de Autenticação */
    .auth-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .auth-card {
      background: var(--bg-panel);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .auth-card h2 {
      color: var(--accent-red);
      font-size: 20px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Inputs e Botões */
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      outline: none;
      font-size: 13px;
    }

    input:focus {
      border-color: var(--accent-red);
    }

    .btn {
      background-color: var(--accent-red);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-red-hover);
    }

    .btn-secondary {
      background-color: #333333;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #444444;
    }

    .error-msg {
      color: #ff5252;
      font-size: 11px;
      text-align: center;
    }

    /* Layout Principal (Sidebar + Chat) */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* Barra Lateral de Amigos */
    .sidebar {
      width: 260px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .user-profile {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(229, 9, 20, 0.05);
    }

    .user-profile span {
      font-size: 12px;
      font-weight: bold;
      color: var(--accent-red);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .add-friend-box {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
    }

    .friends-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .friend-item {
      padding: 8px 12px;
      border-bottom: 1px solid #282828;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s;
    }

    .friend-item:hover, .friend-item.active {
      background-color: var(--bg-hover);
      border-left: 3px solid var(--accent-red);
    }

    .friend-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: var(--accent-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      flex-shrink: 0;
    }

    .friend-email {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Área Principal do Chat */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-dark);
    }

    .chat-header {
      padding: 10px 16px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
    }

    .chat-header h3 {
      font-size: 14px;
    }

    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-chat {
      margin: auto;
      color: var(--text-muted);
      text-align: center;
      font-size: 14px;
    }

    .message {
      max-width: 60%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.3;
      word-wrap: break-word;
      position: relative;
    }

    .message.received {
      align-self: flex-start;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    .message.sent {
      align-self: flex-end;
      background-color: var(--accent-red);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 6px;
      margin-top: 4px;
      display: block;
    }

    .message a.file-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      text-decoration: underline;
      margin-top: 4px;
      word-break: break-all;
    }

    .time {
      font-size: 9px;
      margin-top: 4px;
      display: block;
      opacity: 0.7;
      text-align: right;
    }

    .chat-footer {
      padding: 10px 16px;
      background-color: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .file-btn {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }

    .file-btn:hover {
      background-color: var(--bg-hover);
      border-color: var(--accent-red);
    }

    #fileInput {
      display: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Tela de Login / Cadastro -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h2>Starcord</h2>
      <input type="email" id="authEmail" placeholder="Seu e-mail" required />
      <input type="password" id="authPassword" placeholder="Sua senha" required />
      <button class="btn" id="btnLogin">Entrar / Cadastrar</button>
      <div id="authError" class="error-msg"></div>
    </div>
  </div>

  <!-- Interface Principal -->
  <div id="appScreen" class="app-container hidden">
    <!-- Sidebar: Lista de Amigos -->
    <div class="sidebar">
      <div class="user-profile">
        <span id="userEmailLabel">usuario@email.com</span>
        <button class="btn btn-secondary" id="btnLogout" style="padding: 4px 8px; font-size: 11px;">Sair</button>
      </div>

      <div class="add-friend-box">
        <input type="email" id="friendEmailInput" placeholder="E-mail do amigo" />
        <button class="btn" id="btnAddFriend" style="padding: 0 10px;">+</button>
      </div>

      <div class="friends-list" id="friendsList"></div>
    </div>

    <!-- Área do Chat -->
    <div class="chat-area">
      <div id="noChatSelected" class="empty-chat">
        <h3>Selecione ou adicione um amigo para conversar</h3>
      </div>

      <div id="activeChat" class="chat-area hidden">
        <div class="chat-header">
          <div class="friend-avatar" id="chatAvatar">A</div>
          <h3 id="chatTargetTitle">amigo@email.com</h3>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <form class="chat-footer" id="chatForm">
          <label for="fileInput" class="file-btn" title="Enviar Imagem ou Arquivo">📎</label>
          <input type="file" id="fileInput" />
          <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off" />
          <button type="submit" class="btn">Enviar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Firebase Web SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      query, 
      orderBy, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Configurações do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAoqc8NcgLAQqclCFY-q_PcxATIE0FqU_E",
      authDomain: "starcord-ee336.firebaseapp.com",
      projectId: "starcord-ee336",
      storageBucket: "starcord-ee336.firebasestorage.app",
      messagingSenderId: "166227286926",
      appId: "1:166227286926:web:8cafd28b2eda5fbaf0e2df",
      measurementId: "G-E06X0P832W"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser = null;
    let targetUserEmail = null;
    let unsubscribeMessages = null;

    // Elementos DOM
    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const btnLogin = document.getElementById('btnLogin');
    const authError = document.getElementById('authError');

    const userEmailLabel = document.getElementById('userEmailLabel');
    const btnLogout = document.getElementById('btnLogout');

    const friendEmailInput = document.getElementById('friendEmailInput');
    const btnAddFriend = document.getElementById('btnAddFriend');
    const friendsList = document.getElementById('friendsList');

    const noChatSelected = document.getElementById('noChatSelected');
    const activeChat = document.getElementById('activeChat');
    const chatTargetTitle = document.getElementById('chatTargetTitle');
    const chatAvatar = document.getElementById('chatAvatar');
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const fileInput = document.getElementById('fileInput');

    // 1. Monitorar estado de autenticação
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userEmailLabel.textContent = user.email;
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        carregarAmigos();
      } else {
        currentUser = null;
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
      }
    });

    // 2. Login e Cadastro
    btnLogin.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      authError.textContent = '';

      if (!email || !password) {
        authError.textContent = 'Preencha todos os campos.';
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          try {
            await createUserWithEmailAndPassword(auth, email, password);
          } catch (err) {
            authError.textContent = err.message;
          }
        } else {
          authError.textContent = error.message;
        }
      }
    });

    btnLogout.addEventListener('click', () => signOut(auth));

    // 3. Adicionar Amigo à Lista (Salva no Firestore)
    btnAddFriend.addEventListener('click', async () => {
      const email = friendEmailInput.value.trim().toLowerCase();
      if (!email) return;

      if (email === currentUser.email.toLowerCase()) {
        alert('Você não pode adicionar seu próprio e-mail.');
        return;
      }

      const friendKey = email.replace(/[^a-zA-Z0-9]/g, '_');
      await setDoc(doc(db, "users", currentUser.uid, "friends", friendKey), {
        email: email,
        addedAt: serverTimestamp()
      });

      friendEmailInput.value = '';
    });

    // 4. Carregar Lista de Amigos em Tempo Real
    function carregarAmigos() {
      const friendsRef = collection(db, "users", currentUser.uid, "friends");
      onSnapshot(friendsRef, (snapshot) => {
        friendsList.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const friend = docSnap.data();
          const item = document.createElement('div');
          item.classList.add('friend-item');
          if (targetUserEmail === friend.email) item.classList.add('active');

          item.innerHTML = `
            <div class="friend-avatar">${friend.email[0].toUpperCase()}</div>
            <div class="friend-email">${friend.email}</div>
          `;

          item.addEventListener('click', () => abrirChat(friend.email, item));
          friendsList.appendChild(item);
        });
      });
    }

    // 5. Abrir Chat com Amigo
    function abrirChat(email, element) {
      document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      targetUserEmail = email;
      chatTargetTitle.textContent = email;
      chatAvatar.textContent = email[0].toUpperCase();

      noChatSelected.classList.add('hidden');
      activeChat.classList.remove('hidden');

      carregarMensagens();
    }

    // Gerador de ID da sala
    function getRoomId(e1, e2) {
      return [e1.toLowerCase(), e2.toLowerCase()].sort().join('_').replace(/[^a-zA-Z0-9]/g, '_');
    }

    // 6. Escutar Mensagens do Chat Selecionado
    function carregarMensagens() {
      chatMessages.innerHTML = '';
      const roomId = getRoomId(currentUser.email, targetUserEmail);

      const q = query(
        collection(db, "chats", roomId, "messages"),
        orderBy("timestamp", "asc")
      );

      if (unsubscribeMessages) unsubscribeMessages();

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        chatMessages.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const tipo = data.sender === currentUser.email ? 'sent' : 'received';

          let hora = '';
          if (data.timestamp) {
            const date = data.timestamp.toDate();
            hora = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }

          const msgDiv = document.createElement('div');
          msgDiv.classList.add('message', tipo);

          let conteudo = '';
          if (data.text) {
            conteudo += `<div>${data.text}</div>`;
          }

          if (data.fileUrl) {
            if (data.fileType && data.fileType.startsWith('image/')) {
              conteudo += `<img src="${data.fileUrl}" alt="Imagem enviada" />`;
            } else {
              conteudo += `<a class="file-link" href="${data.fileUrl}" target="_blank" download>📄 ${data.fileName || 'Arquivo'}</a>`;
            }
          }

          msgDiv.innerHTML = `
            ${conteudo}
            <span class="time">${hora}</span>
          `;

          chatMessages.appendChild(msgDiv);
        });

        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }

    // 7. Enviar Mensagem (Texto e/ou Arquivo)
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const text = messageInput.value.trim();
      const file = fileInput.files[0];

      if ((!text && !file) || !targetUserEmail) return;

      const roomId = getRoomId(currentUser.email, targetUserEmail);
      messageInput.value = '';
      let fileUrl = null;
      let fileName = null;
      let fileType = null;

      if (file) {
        fileName = file.name;
        fileType = file.type;
        const storageRef = ref(storage, `uploads/${roomId}/${Date.now()}_${file.name}`);
        const uploadTask = await uploadBytes(storageRef, file);
        fileUrl = await getDownloadURL(uploadTask.ref);
        fileInput.value = '';
      }

      await addDoc(collection(db, "chats", roomId, "messages"), {
        text: text,
        fileUrl: fileUrl,
        fileName: fileName,
        fileType: fileType,
        sender: currentUser.email,
        recipient: targetUserEmail,
        timestamp: serverTimestamp()
      });
    });
  </script>
</body>
</html>
