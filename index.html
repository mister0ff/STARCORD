<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Starcord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0b0e;
      --bg-panel: #13131a;
      --bg-card: #181824;
      --bg-hover: #222230;
      --bg-input: #1c1c28;
      
      --accent-red: #e50914;
      --accent-red-hover: #ff1e27;
      --accent-red-glow: rgba(229, 9, 20, 0.25);
      
      --text-main: #f3f3f7;
      --text-muted: #8b8ba7;
      --border-color: rgba(255, 255, 255, 0.07);
      --border-focus: rgba(229, 9, 20, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Tela Splash Inicial */
    .splash-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-icon {
      width: 120px;
      height: 120px;
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    /* Tela de Autenticação */
    .auth-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top center, rgba(229, 9, 20, 0.15), transparent 60%), var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .auth-card {
      background: var(--bg-panel);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-color);
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .brand-logo svg {
      color: var(--accent-red);
      filter: drop-shadow(0 0 8px var(--accent-red-glow));
    }

    .auth-card h2 {
      color: var(--text-main);
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      margin-top: -8px;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    input:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-red-glow);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-red), #b80710);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--accent-red-glow);
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--accent-red-hover), var(--accent-red));
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #2c2c3e;
    }

    .btn-icon {
      padding: 8px;
      border-radius: 8px;
      aspect-ratio: 1;
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 12px;
      text-align: center;
      min-height: 14px;
    }

    .toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
      width: 100%;
      padding: 0 16px;
    }

    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-red);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 380px;
      width: 100%;
      animation: toastIn 0.2s ease;
    }

    .toast.success {
      border-left-color: #23c268;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Layout Principal */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .sidebar {
      width: 100%;
      height: 100%;
      background-color: var(--bg-panel);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      overflow: hidden;
    }

    .user-profile {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }

    .user-profile:hover {
      background-color: var(--bg-hover);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .user-avatar-main {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-red), #500);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .user-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-display-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-status-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .add-friend-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .section-header {
      padding: 12px 16px 6px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* Solicitacões de amizade */
    .requests-list {
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .request-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .request-info {
      font-size: 12px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .request-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-accept {
      background: #23c268;
      color: #fff;
    }

    .btn-reject {
      background: rgba(255,255,255,0.1);
      color: var(--text-muted);
    }

    .req-badge {
      background: var(--accent-red);
      color: white;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .friends-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 0 8px;
    }

    .friend-item {
      padding: 10px 12px;
      margin-bottom: 2px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .friend-item:hover {
      background-color: var(--bg-hover);
    }

    .friend-item.has-unread {
      background-color: rgba(229, 9, 20, 0.08);
    }

    .friend-item.has-unread .friend-name {
      color: #fff;
      font-weight: 700;
    }

    .friend-avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .friend-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-red), #800000);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #ffffff;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
    }

    .unread-badge {
      position: absolute;
      top: -4px;
      right: -6px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--accent-red);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-panel);
    }

    .friend-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .friend-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend-status {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Área do Chat */
    .chat-area {
      display: none;
      width: 100%;
      height: 100%;
      height: 100dvh;
      flex-direction: column;
      background-color: var(--bg-dark);
      overflow: hidden;
    }

    .app-container.chat-open .sidebar { display: none; }
    .app-container.chat-open .chat-area { display: flex; }

    .chat-header {
      padding: 0 16px;
      background-color: rgba(19, 19, 26, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      flex-shrink: 0;
    }

    .chat-user-target {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .chat-user-target:hover {
      background-color: var(--bg-hover);
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      word-wrap: break-word;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .message.received {
      align-self: flex-start;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    .message.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent-red), #b80710);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      margin-top: 6px;
      display: block;
    }

    .message a.file-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 6px;
      font-size: 12px;
    }

    .time {
      font-size: 10px;
      margin-top: 4px;
      display: block;
      opacity: 0.65;
      text-align: right;
    }

    /* Rodapé fixo para envio de mensagem */
    .chat-footer {
      padding: 12px 16px;
      background-color: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }

    .file-btn {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    #fileInput { display: none; }
    #avatarFileInput { display: none; }

    /* Modal de Perfil */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
    }

    .profile-modal {
      background: var(--bg-panel);
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--border-color);
    }

    .modal-top-bar h3 {
      font-size: 14px;
      font-weight: 600;
    }

    .profile-banner {
      height: 100px;
      background: linear-gradient(135deg, var(--accent-red), #400000);
      position: relative;
    }

    .profile-avatar-wrapper {
      position: relative;
      margin-top: -40px;
      margin-left: 20px;
      width: 80px;
      height: 80px;
    }

    .profile-avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 4px solid var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--accent-red);
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .avatar-edit-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .profile-avatar-wrapper:hover .avatar-edit-overlay {
      opacity: 1;
    }

    .profile-body {
      padding: 16px 20px 20px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .profile-card-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .field-value {
      font-size: 13px;
      color: var(--text-main);
      line-height: 1.4;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Tela Splash -->
  <div id="splashScreen" class="splash-screen">
    <img id="splashIcon" class="splash-icon" src="https://cdn.discordapp.com/attachments/1462160007893356677/1541077858435334214/BackgroundEraser_20260823_103144066.png?ex=6a8c4819&is=6a8af699&hm=cb0edc13de5690c9170c0c1867f34424044543b1a420f35c6bbf8409c59660e6&" alt="Carregando..." />
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Autenticação -->
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="brand-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <h2>Starcord</h2>
      <p>Acesse sua conta para conversar</p>
      
      <div class="input-group">
        <input type="email" id="authEmail" placeholder="Seu e-mail" required />
      </div>
      <div class="input-group">
        <input type="password" id="authPassword" placeholder="Sua senha" required />
      </div>
      
      <button class="btn" id="btnLogin">
        <span>Entrar / Cadastrar</span>
      </button>
      
      <div id="authError" class="error-msg"></div>
    </div>
  </div>

  <!-- Interface Principal -->
  <div id="appScreen" class="app-container hidden">
    <div class="sidebar">
      <div class="user-profile" id="btnOpenSelfProfile" title="Clique para editar seu perfil">
        <div class="user-info">
          <div class="user-avatar-main" id="userAvatarMain">U</div>
          <div class="user-details">
            <span class="user-display-name" id="userDisplayName">Carregando...</span>
            <span class="user-status-sub" id="userStatusSub">Definir status</span>
          </div>
        </div>
        <button class="btn btn-secondary btn-icon" id="btnLogout" title="Sair">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>

      <div class="add-friend-box">
        <input type="email" id="friendEmailInput" placeholder="Adicionar por e-mail..." />
        <button class="btn btn-icon" id="btnAddFriend" title="Enviar Pedido">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
        </button>
      </div>

      <!-- Pedidos de amizade recebidos -->
      <div class="section-header">
        <span>Pedidos de Amizade</span>
        <span id="requestsCountBadge" class="req-badge hidden">0</span>
      </div>
      <div class="requests-list" id="requestsList"></div>

      <div class="section-header">
        <span>Mensagens Diretas</span>
      </div>
      <div class="friends-list" id="friendsList"></div>
    </div>

    <!-- Chat -->
    <div class="chat-area" id="chatArea">
      <div class="chat-header">
        <button id="btnBack" class="btn btn-secondary btn-icon" title="Voltar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="chat-user-target" id="btnOpenFriendProfile" title="Ver perfil do amigo">
          <div class="friend-avatar" id="chatAvatar">A</div>
          <div class="user-details">
            <h3 id="chatTargetTitle">amigo@email.com</h3>
            <span class="user-status-sub" id="chatTargetStatus">Ver Perfil</span>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages"></div>

      <form class="chat-footer" id="chatForm">
        <label for="fileInput" class="file-btn" title="Anexar arquivo">

    function getSafeKey(email) {
      return email.toLowerCase().replace(/[^a-zA-Z0-9]/g, '_');
    }

    function convertAndCompressImageToDataUrl(file, maxWidth = 128, maxHeight = 128, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = maxWidth;
            canvas.height = maxHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, maxWidth, maxHeight);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function showToast(message, type = 'info', duration = 4000) {
      const el = document.createElement('div');
      el.className = 'toast' + (type === 'success' ? ' success' : '');
      el.textContent = message;
      toastContainer.appendChild(el);
      setTimeout(() => el.remove(), duration);
    }

    function pedirPermissaoNotificacao() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') {
        notificationsEnabled = true;
        return;
      }
      if (Notification.permission !== 'denied') {
        Notification.requestPermission().then((perm) => {
          notificationsEnabled = perm === 'granted';
        });
      }
    }

    function dispararNotificacao(titulo, corpo, avatarUrl) {
      if (!notificationsEnabled) return;
      try {
        const notif = new Notification(titulo, {
          body: corpo,
          icon: avatarUrl || undefined,
          tag: titulo
        });
        notif.onclick = () => window.focus();
      } catch (e) {}
    }

    onAuthStateChanged(auth, async (user) => {
      authChecked = true;
      if (user) {
        currentUser = user;
        pedirPermissaoNotificacao();
        await carregarMeuPerfil();
        carregarPedidosDeAmizade();
        carregarAmigos();
      } else {
        currentUser = null;
        Object.values(friendMessageState).forEach(state => {
          if (state.unsub) state.unsub();
        });
        Object.keys(friendMessageState).forEach(k => delete friendMessageState[k]);
      }
      revelarTelaCorreta();
    });

    btnLogin.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      authError.textContent = '';

      if (!email || !password) {

        return;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          try {
            await createUserWithEmailAndPassword(auth, email, password);
          } catch (err) {
            authError.textContent = err.message;
          }
        } else {
          authError.textContent = error.message;
        }
      } finally {
        btnLogin.disabled = false;
      }
    });

    btnLogout.addEventListener('click', (e) => {
      e.stopPropagation();
      signOut(auth);
    });

    btnBack.addEventListener('click', () => {
      appScreen.classList.remove('chat-open');
      targetUserEmail = null;
    });

    async function carregarMeuPerfil() {
      const safeKey = getSafeKey(currentUser.email);
      const profileRef = doc(db, "profiles", safeKey);
      
      onSnapshot(profileRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          userDisplayName.textContent = data.displayName || currentUser.email.split('@')[0];
          userStatusSub.textContent = data.status || 'Definir status';
          
          if (data.avatarUrl) {
            userAvatarMain.style.backgroundImage = `url(${data.avatarUrl})`;
            userAvatarMain.textContent = '';
          } else {
            userAvatarMain.style.backgroundImage = 'none';
            userAvatarMain.textContent = (data.displayName || currentUser.email)[0].toUpperCase();
          }
        } else {
          setDoc(profileRef, {
            email: currentUser.email,
            displayName: currentUser.email.split('@')[0],
            status: '',
            pronouns: '',
            bio: '',
            avatarUrl: ''
          }).catch((err) => showToast('Erro ao criar perfil: ' + err.message, 'error'));
        }
      }, (err) => {
        showToast('Erro ao carregar seu perfil: ' + err.message, 'error');
      });
    }

    btnOpenSelfProfile.addEventListener('click', async () => {
      let data = {};
      try {
        const safeKey = getSafeKey(currentUser.email);

    // Carregar e ouvir solicitações de amizade recebidas
    function carregarPedidosDeAmizade() {
      const mySafeKey = getSafeKey(currentUser.email);
      const reqRef = collection(db, "users", mySafeKey, "requests");

      onSnapshot(reqRef, (snapshot) => {
        requestsList.innerHTML = '';
        const total = snapshot.docs.length;

        if (total > 0) {
          requestsCountBadge.textContent = total;
          requestsCountBadge.classList.remove('hidden');
        } else {
          requestsCountBadge.classList.add('hidden');
        }

        snapshot.forEach((docSnap) => {
          const reqData = docSnap.data();
          const senderSafeKey = docSnap.id;

          const item = document.createElement('div');
          item.className = 'request-item';
          item.innerHTML = `
            <span class="request-info" title="${reqData.fromEmail}">${reqData.fromEmail}</span>
            <div class="request-actions">
              <button class="btn-sm btn-accept" data-email="${reqData.fromEmail}" data-uid="${reqData.fromUid}" data-key="${senderSafeKey}">Aceitar</button>
              <button class="btn-sm btn-reject" data-key="${senderSafeKey}">Recusar</button>
            </div>
          `;

          // Aceitar pedido
          item.querySelector('.btn-accept').addEventListener('click', async (e) => {
            const senderEmail = e.target.getAttribute('data-email');
            const senderUid = e.target.getAttribute('data-uid');
            const key = e.target.getAttribute('data-key');

            try {
              // Adiciona na minha lista de amigos
              await setDoc(doc(db, "users", currentUser.uid, "friends", key), {
                email: senderEmail,
                addedAt: serverTimestamp()
              });

              // Adiciona no amigo (se UID disponível, senão adiciona via chave do e-mail dele)
              if (senderUid) {
                await setDoc(doc(db, "users", senderUid, "friends", mySafeKey), {
                  email: currentUser.email,
                  addedAt: serverTimestamp()
                });
              }

              // Deleta o pedido
              await deleteDoc(doc(db, "users", mySafeKey, "requests", key));
              showToast(`Agora você é amigo de ${senderEmail}!`, 'success');
            } catch (err) {
              showToast('Erro ao aceitar pedido: ' + err.message, 'error');
            }
          });

          // Recusar pedido
          item.querySelector('.btn-reject').addEventListener('click', async (e) => {
            const key = e.target.getAttribute('data-key');
            try {
              await deleteDoc(doc(db, "users", mySafeKey, "requests", key));
              showToast('Pedido recusado.', 'info');
            } catch (err) {
              showToast('Erro ao recusar: ' + err.message, 'error');
            }
          });

          requestsList.appendChild(item);
        });
      }, (err) => {
        showToast('Erro ao carregar solicitações: ' + err.message, 'error');
      });
    }

    function escutarMensagensDoAmigo(friendEmail, friendKey, displayName, avatarUrl) {
      if (friendMessageState[friendKey] && friendMessageState[friendKey].unsub) return;

      const roomId = [currentUser.email.toLowerCase(), friendEmail.toLowerCase()].sort().join('_').replace(/[^a-zA-Z0-9]/g, '_');
      const q = query(collection(db, "chats", roomId, "messages"), orderBy("timestamp", "asc"));

      const state = {
        unsub: null,
        unreadCount: 0,
        lastMessageText: '',
        lastRead: null,
        initialLoadDone: false,
        seenIds: new Set()
      };
      friendMessageState[friendKey] = state;

      getDoc(doc(db, "users", currentUser.uid, "friends", friendKey)).then((snap) => {
        const d = snap.data() || {};
        state.lastRead = d.lastRead || null;
      }).catch(() => {});

      state.unsub = onSnapshot(q, (snapshot) => {
        let unread = 0;
        let lastText = '';
        const isChatOpenWithThisFriend = targetUserEmail === friendEmail && appScreen.classList.contains('chat-open');

        snapshot.forEach((docSnap) => {
          const m = docSnap.data();
          const isNewDoc = !state.seenIds.has(docSnap.id);
          state.seenIds.add(docSnap.id);

          if (m.fileUrl && !m.text) {
            lastText = m.fileType && m.fileType.startsWith('image/') ? '📷 Imagem' : '📎 Arquivo';
          } else if (m.text) {
            lastText = m.text;
          }

          const isFromFriend = m.sender === friendEmail;
          const afterLastRead = !state.lastRead || (m.timestamp && m.timestamp.toMillis() > state.lastRead.toMillis());

          if (isFromFriend && afterLastRead && !isChatOpenWithThisFriend) unread++;

          if (state.initialLoadDone && isNewDoc && isFromFriend && !isChatOpenWithThisFriend) {
            dispararNotificacao(displayName, lastText || 'Nova mensagem', avatarUrl);
          }
        });

        state.unreadCount = unread;
        state.lastMessageText = lastText;
        state.initialLoadDone = true;

        atualizarItemAmigoNaLista(friendKey);
      }, () => {});
    }

    function atualizarItemAmigoNaLista(friendKey) {
      const item = friendsList.querySelector(`[data-friend-key="${friendKey}"]`);
      if (!item) return;
      const state = friendMessageState[friendKey];
      if (!state) return;

      const badge = item.querySelector('.unread-badge');
      const statusEl = item.querySelector('.friend-status');

      if (state.unreadCount > 0) {
        item.classList.add('has-unread');
        if (badge) {
          badge.textContent = state.unreadCount > 99 ? '99+' : state.unreadCount;
          badge.classList.remove('hidden');
        }
      } else {
        item.classList.remove('has-unread');
        if (badge) badge.classList.add('hidden');
      }

      if (statusEl && state.lastMessageText) {
        statusEl.textContent = state.lastMessageText;
      }
    }

    function carregarAmigos() {
      const friendsRef = collection(db, "users", currentUser.uid, "friends");
      onSnapshot(friendsRef, (snapshot) => {
        friendsList.innerHTML = '';
        snapshot.forEach(async (docSnap) => {
          const friend = docSnap.data();
          const friendSafeKey = getSafeKey(friend.email);

          let pData = {};
          try {
            const profileSnap = await getDoc(doc(db, "profiles", friendSafeKey));
            pData = profileSnap.data() || {};
          } catch (err) {}

          const displayName = pData.displayName || friend.email.split('@')[0];
          const statusText = pData.status || friend.email;

          const item = document.createElement('div');
          item.classList.add('friend-item');
          item.setAttribute('data-friend-key', friendSafeKey);
          if (targetUserEmail === friend.email) item.classList.add('active');

          let avatarStyle = pData.avatarUrl ? `style="background-image: url('${pData.avatarUrl}')"` : '';
          let avatarContent = pData.avatarUrl ? '' : displayName[0].toUpperCase();

          item.innerHTML = `
            <div class="friend-avatar-wrapper">
              <div class="friend-avatar" ${avatarStyle}>${avatarContent}</div>
              <span class="unread-badge hidden">0</span>
            </div>
            <div class="friend-details">
              <div class="friend-name">${displayName}</div>
              <div class="friend-status">${statusText}</div>
            </div>
          `;

          item.addEventListener('click', () => abrirChat(friend.email, displayName, pData.status, pData.avatarUrl));
          friendsList.appendChild(item);

          escutarMensagensDoAmigo(friend.email, friendSafeKey, displayName, pData.avatarUrl);
          atualizarItemAmigoNaLista(friendSafeKey);
        });
      }, (err) => {
        showToast('Erro ao carregar amigos: ' + err.message, 'error');
      });
    }

    async function marcarComoLido(friendEmail, friendKey) {
      const now = Timestamp.now();
      if (friendMessageState[friendKey]) {
        friendMessageState[friendKey].lastRead = now;
        friendMessageState[friendKey].unreadCount = 0;
        atualizarItemAmigoNaLista(friendKey);
      }
      try {
        await setDoc(doc(db, "users", currentUser.uid, "friends", friendKey), {
          lastRead: now
        }, { merge: true });
      } catch (err) {}
    }

    function abrirChat(email, name, status, avatarUrl) {
      targetUserEmail = email;
      chatTargetTitle.textContent = name;
      chatTargetStatus.textContent = status || "Clique para ver o perfil";

      if (avatarUrl) {
        chatAvatar.style.backgroundImage = `url(${avatarUrl})`;
        chatAvatar.textContent = '';
      } else {
        chatAvatar.style.backgroundImage = 'none';
        chatAvatar.textContent = name[0].toUpperCase();
      }

      appScreen.classList.add('chat-open');
      carregarMensagens();

      const friendKey = getSafeKey(email);
      marcarComoLido(email, friendKey);
    }

    function carregarMensagens() {
      chatMessages.innerHTML = '';
      const roomId = [currentUser.email.toLowerCase(), targetUserEmail.toLowerCase()].sort().join('_').replace(/[^a-zA-Z0-9]/g, '_');
      const friendKey = getSafeKey(targetUserEmail);

      const q = query(
        collection(db, "chats", roomId, "messages"),
        orderBy("timestamp", "asc")
      );

      if (unsubscribeMessages) unsubscribeMessages();

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        chatMessages.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const tipo = data.sender === currentUser.email ? 'sent' : 'received';

          let hora = '';
          if (data.timestamp) {
            const date = data.timestamp.toDate();
            hora = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }

          const msgDiv = document.createElement('div');
          msgDiv.classList.add('message', tipo);

          let conteudo = '';
          if (data.text) {
            conteudo += `<div>${data.text}</div>`;
          }

          if (data.fileUrl) {
            if (data.fileType && data.fileType.startsWith('image/')) {
              conteudo += `<img src="${data.fileUrl}" alt="Imagem enviada" />`;
            } else {
              conteudo += `<a class="file-link" href="${data.fileUrl}" target="_blank" download>${data.fileName || 'Arquivo'}</a>`;
            }
          }

          msgDiv.innerHTML = `
            ${conteudo}
            <span class="time">${hora}</span>
          `;

          chatMessages.appendChild(msgDiv);
        });

        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (appScreen.classList.contains('chat-open') && targetUserEmail) {
          marcarComoLido(targetUserEmail, friendKey);
        }
      }, (err) => {
        showToast('Erro ao carregar mensagens: ' + err.message, 'error');
      });
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const text = messageInput.value.trim();
      const file = fileInput.files[0];

      if ((!text && !file) || !targetUserEmail) return;

      const roomId = [currentUser.email.toLowerCase(), targetUserEmail.toLowerCase()].sort().join('_').replace(/[^a-zA-Z0-9]/g, '_');
      messageInput.value = '';
      let fileUrl = null;
      let fileName = null;
      let fileType = null;

      try {
        if (file) {
          fileName = file.name;
          fileType = file.type;
          fileUrl = await convertAndCompressImageToDataUrl(file, 800, 800, 0.8);
          fileInput.value = '';
        }

        await addDoc(collection(db, "chats", roomId, "messages"), {
          text: text,
          fileUrl: fileUrl,
          fileName: fileName,
          fileType: fileType,
          sender: currentUser.email,
          recipient: targetUserEmail,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        showToast('Não foi possível enviar: ' + err.message, 'error', 6000);
        if (!messageInput.value) messageInput.value = text;
      }
    });
  </script>
</body>
</html>
